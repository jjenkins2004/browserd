<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Q3 Planning - Slides</title>
<style>
  body { margin: 0; font: 13px/1.3 Arial, sans-serif; color: #202124; background: #f8f9fa; overflow: hidden; }
  #top { height: 64px; background: #fff; display: flex; flex-direction: column; justify-content: center; padding: 0 12px; }
  #top .title { display: flex; align-items: center; gap: 10px; }
  #top .title input { font-size: 18px; border: 0; width: 220px; }
  #top .title .saved { color: #5f6368; font-size: 12px; }
  #top .title button.share { background: #c2e7ff; border: 0; border-radius: 16px; padding: 7px 18px; }
  #top .title button.ghost { background: none; border: 0; font-size: 14px; }
  #insertion { position: absolute; right: 8px; top: 124px; display: flex; flex-direction: column; gap: 4px; }
  #insertion button { width: 32px; height: 32px; border: 0; background: #fff; border-radius: 6px; }
  #menus button { background: none; border: 0; padding: 2px 7px; font-size: 14px; }
  #toolbar { height: 40px; display: flex; align-items: center; gap: 2px; padding: 0 10px; background: #edf2fa; border-radius: 20px; margin: 4px 10px; }
  #toolbar button { min-width: 28px; height: 28px; border: 0; background: none; border-radius: 4px; font-size: 13px; }
  #toolbar button.on { background: #d3e3fd; }
  #toolbar .sep { width: 1px; height: 20px; background: #c7c7c7; margin: 0 4px; }
  #strip { position: absolute; left: 0; top: 116px; bottom: 0; width: 196px; overflow-y: auto; padding: 8px 6px; box-sizing: border-box; }
  #strip .thumb { display: flex; gap: 6px; margin-bottom: 10px; cursor: pointer; }
  #strip .thumb .n { width: 14px; text-align: right; color: #5f6368; }
  #strip .thumb svg { width: 160px; height: 90px; background: #fff; border: 2px solid #dadce0; border-radius: 4px; }
  #strip .thumb.current svg { border-color: #fbbc04; }
  #stage { position: absolute; left: 210px; top: 124px; }
  #slide { width: 960px; height: 540px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  #notes { position: absolute; left: 210px; top: 680px; width: 960px; height: 60px; background: #fff; border: 1px solid #dadce0; color: #5f6368; padding: 8px; box-sizing: border-box; }
  #editor { position: absolute; left: -2000px; top: 0; width: 400px; height: 200px; }
  .palette { position: absolute; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3); padding: 8px; display: grid; grid-template-columns: repeat(10, 20px); gap: 3px; z-index: 5; }
  .palette button { width: 20px; height: 20px; border: 1px solid #ccc; padding: 0; }
  .palette .head { grid-column: 1 / -1; font-size: 12px; color: #5f6368; }
  #popover { position: fixed; left: 300px; top: 52px; width: 720px; height: 150px; background: #fff; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.35); z-index: 10; padding: 16px 20px; box-sizing: border-box; }
  #popover h2 { margin: 0 0 6px; font-size: 18px; }
  #popover p { margin: 0 0 14px; color: #3c4043; }
  #popover button { padding: 7px 16px; border-radius: 16px; border: 1px solid #747775; background: #fff; margin-right: 8px; }
  #popover button.primary { background: #0b57d0; color: #fff; border-color: #0b57d0; }
  #panel { position: absolute; right: 0; top: 116px; bottom: 0; width: 240px; background: #fff; border-left: 1px solid #dadce0; padding: 12px; box-sizing: border-box; }
</style>
</head>
<body>
<div id="top">
  <div class="title"><input aria-label="Rename" value="Q3 Planning"><button type="button" class="ghost" aria-label="Star">☆</button>
    <button type="button" class="ghost" aria-label="Document status: Saved to Drive.">☁</button><span class="saved">All changes saved in Drive</span>
    <button type="button" class="ghost" style="margin-left:auto" aria-label="Last edit was seconds ago">🕘</button>
    <button type="button" class="ghost" aria-label="Show all comments">💬</button>
    <button type="button" class="ghost" aria-label="Join a call here or present this tab to the call">📹</button>
    <button type="button" class="ghost" aria-label="Start slideshow (Ctrl+F5)">Slideshow</button>
    <button type="button" class="ghost" aria-label="Presentation options">▾</button>
    <button class="share" type="button" aria-label="Share. Private to only me.">Share</button>
    <button type="button" class="ghost" aria-label="Google Account: Priya Shah (priya@northwind.example)">PS</button></div>
  <div id="menus" role="menubar"></div>
</div>
<div id="toolbar" role="toolbar" aria-label="Main toolbar"></div>
<div id="strip"></div>
<div id="stage"><svg id="slide" viewBox="0 0 960 540"></svg></div>
<div id="notes" role="complementary" aria-label="Speaker notes"><div role="textbox" aria-label="Speaker notes" aria-multiline="true">Click to add speaker notes</div></div>
<div id="insertion" role="toolbar" aria-label="Insertion">
  <button type="button" aria-label="Create a slide">＋</button><button type="button" aria-label="Generate an image">✨</button>
  <button type="button" aria-label="Templates">▤</button><button type="button" aria-label="Building blocks">▦</button>
  <button type="button" aria-label="Stock and web">🌐</button><button type="button" aria-label="Drive and Photos">📁</button>
  <button type="button" aria-label="Record video">⏺</button><button type="button" aria-label="Turn into video">🎞</button>
</div>
<textarea id="editor" aria-label="Slide text"></textarea>
<script>
const SCENARIO = "deck";
const RUN = new URLSearchParams(location.search).get("run") || "none";
const ATTEMPT = __ATTEMPT__;  // the server's, so a run started again starts from a fresh page
const KEY = "pn-" + SCENARIO + "-" + RUN + "-" + ATTEMPT;
const IDLE_MS = 1000;  // the popover opens on the first pointer move this long after any input, once the slide was edited
const MENUS = ["File", "Edit", "View", "Insert", "Format", "Slide", "Arrange", "Tools", "Extensions", "Help"];
const TOOLS = [["Undo (Ctrl+Z)", "↶"], ["Redo (Ctrl+Y)", "↷"], ["Print (Ctrl+P)", "⎙"], ["Paint format", "🖌"], ["Zoom", "100%"],
  null, ["Select", "↖"], ["Text box", "T"], ["Insert image", "🖼"], ["Shape", "◯"], ["Line", "╱"], null,
  ["Add comment (Ctrl+Alt+M)", "💬"], ["Background", "Background"], ["Layout", "Layout"], ["Theme", "Theme"], ["Transition", "Transition"],
  null, ["Font", "Arial"], ["Font size", "18"], ["Bold (Ctrl+B)", "B"], ["Italic (Ctrl+I)", "I"], ["Underline (Ctrl+U)", "U"],
  ["Text color", "A"], ["Highlight color", "✎"], null, ["Align", "≡"], ["Line & paragraph spacing", "↕"],
  ["Bulleted list", "•≡"], ["Numbered list", "1≡"], ["Decrease indent", "⇤"], ["Increase indent", "⇥"],
  ["Clear formatting", "⌫"], null, ["Your pointer is hidden (Ctrl+Alt+L Ctrl+Alt+M)", "⌖"], ["Hide the menus (Ctrl+Shift+F)", "⌃"]];
// Google's palette names, one row per shade.
const SHADES = ["black", "dark gray 4", "dark gray 3", "dark gray 2", "dark gray 1", "gray", "light gray 1", "light gray 2", "light gray 3", "white"];
const HUES = [["red berry", "#980000"], ["red", "#ff0000"], ["orange", "#ff9900"], ["yellow", "#ffff00"], ["green", "#00ff00"],
  ["cyan", "#00ffff"], ["cornflower blue", "#4a86e8"], ["blue", "#0000ff"], ["purple", "#9900ff"], ["magenta", "#ff00ff"]];
const SHADE_HEX = ["#000000", "#434343", "#666666", "#999999", "#b7b7b7", "#cccccc", "#d9d9d9", "#efefef", "#f3f3f3", "#ffffff"];
const DARK = {"red berry": ["#85200c", "#5b0f00", "#380d00"], "red": ["#cc0000", "#990000", "#660000"], "orange": ["#e69138", "#b45f06", "#783f04"],
  "yellow": ["#f1c232", "#bf9000", "#7f6000"], "green": ["#6aa84f", "#38761d", "#274e13"], "cyan": ["#45818e", "#134f5c", "#0c343d"],
  "cornflower blue": ["#3c78d8", "#1155cc", "#1c4587"], "blue": ["#3d85c6", "#0b5394", "#073763"], "purple": ["#674ea7", "#351c75", "#20124d"],
  "magenta": ["#a64d79", "#741b47", "#4c1130"]};
const COLORS = {};
SHADES.forEach((n, i) => { COLORS[n] = SHADE_HEX[i]; });
HUES.forEach(([n, hex]) => { COLORS[n] = hex; [1, 2, 3].forEach(k => { COLORS["dark " + n + " " + k] = DARK[n][k - 1]; }); });
const DECK = [
  ["Q3 Planning", ["Northwind Events", "Leadership offsite, October 2026"]],
  ["Agenda", ["Where we are", "Goals for the quarter", "Budget and risks", "Next steps"]],
  ["Goals for the quarter", ["Launch the partner portal", "Grow repeat bookings by 15%", "Hire two account managers"]],
  ["Budget", ["Venue: $12,800", "Travel: $3,900", "Catering: $6,450", "Contingency: $2,000"]],  // the task's slide
  ["Timeline", ["July: venue and dates", "August: speakers and agenda", "September: travel and catering"]],
  ["Risks", ["Hotel prices rising in Lisbon", "Two speakers not confirmed", "Visa delays for three guests"]],
  ["Team", ["Priya Shah, events lead", "Marco Diaz, partnerships", "Lena Fischer, operations"]],
  ["Partner portal", ["Beta with eight partners", "Self-serve booking in August", "Invoices through the portal"]],
  ["Repeat bookings", ["Loyalty discount for third booking", "Quarterly check-in calls", "New welcome pack"]],
  ["Hiring", ["Two account managers by September", "One contractor for the portal"]],
  ["Customer feedback", ["Faster quotes requested", "More vegetarian menus", "Clearer cancellation terms"]],
  ["Venues shortlist", ["Lisbon riverside hall", "Porto old customs house", "Sintra palace gardens"]],
  ["Speakers", ["Keynote: Dr. Amara Okonkwo", "Panel on hybrid events", "Partner showcase"]],
  ["Catering", ["Local suppliers only", "Two vegetarian mains", "Coffee bar all day"]],
  ["Travel", ["Group fares booked by August 15", "Shuttle from the airport", "Rail option from Porto"]],
  ["Marketing", ["Save the date in July", "Partner newsletter feature", "Social posts weekly"]],
  ["Metrics", ["Bookings per partner", "Net promoter score", "Cost per attendee"]],
  ["Open questions", ["Second venue as backup?", "Livestream the keynote?", "Gift for speakers?"]],
  ["Next steps", ["Confirm venue by July 20", "Send speaker invitations", "Book group travel"]],
  ["Thank you", ["Questions: events@northwind.example"]],
];
// Every slide but the task's carries who owns it and when it is next reviewed, as planning decks do.
const OWNERS = ["Priya Shah", "Marco Diaz", "Lena Fischer", "Sam Okafor"];
DECK.forEach(([, bullets], i) => { if (i !== 3) bullets.push("Owner: " + OWNERS[i % 4] + ", next review " + ["July 14", "July 28", "August 11", "August 25", "September 8"][i % 5]); });
let state = JSON.parse(localStorage.getItem(KEY) || "null") || {
  slides: DECK.map(([title, bullets]) => ({title: [{text: title, color: "#202124", highlight: null}],
                                            body: bullets.map(b => ({text: b, color: "#3c4043", highlight: null}))})),
  current: 0, edited: false, popover: "never"};
const fresh = !localStorage.getItem(KEY);
let selected = null;  // "title" | "body" | null
let editing = false;
let lastInput = Date.now();
const BOXES = {title: {x: 60, y: 40, w: 840, h: 90, size: 40, lead: 48}, body: {x: 60, y: 160, w: 840, h: 320, size: 24, lead: 40}};

function log(kind, data) {
  fetch("/log", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(Object.assign({run: RUN, scenario: SCENARIO, kind, t: Date.now()}, data || {}))}).catch(() => {});
}
function keep() { localStorage.setItem(KEY, JSON.stringify(state)); }
function rect(el) {
  const r = el.getBoundingClientRect();
  return [Math.round(r.x), Math.round(r.y), Math.round(r.width), Math.round(r.height)];
}
// What is where, for the experiment's oracle: every named control and overlay, bottom to top.
function layout(why) {
  const items = [];
  document.querySelectorAll("#menus button, #toolbar button").forEach(b => items.push([b.getAttribute("aria-label") || b.textContent, ...rect(b), "control"]));
  document.querySelectorAll("#strip .thumb").forEach((t, i) => items.push(["Slide " + (i + 1), ...rect(t), "thumb"]));
  for (const name of ["title", "body"]) {
    const box = document.getElementById("box-" + name);
    if (box) items.push([lines(name).map(l => l.text).join(" / "), ...rect(box), "box"]);
  }
  document.querySelectorAll(".palette button").forEach(b => items.push([b.getAttribute("aria-label"), ...rect(b), "swatch"]));
  const pop = document.getElementById("popover");
  if (pop) {
    items.push(["popover", ...rect(pop), "overlay"]);
    pop.querySelectorAll("button").forEach(b => items.push([b.textContent, ...rect(b), "overlay-control"]));
  }
  log("layout", {why, items, editing, selected});
}
function lines(name) { return state.slides[state.current][name]; }
const measure = document.createElement("canvas").getContext("2d");
function words(name) {
  // Each word its own SVG text node, as Slides draws them, laid out line by line with wrapping.
  const box = BOXES[name], out = [];
  let y = box.y + box.size + 6;
  measure.font = (name === "title" ? "bold " : "") + box.size + "px Arial";
  lines(name).forEach((line, index) => {
    let x = box.x + 12 + (name === "body" ? 28 : 0);
    if (name === "body") out.push({text: "•", x: box.x + 14, y, line: index, bullet: true});
    const parts = line.text.split(/(\s+)/);
    let offset = 0;
    for (const part of parts) {
      const width = measure.measureText(part).width;
      if (part.trim()) {
        if (x + width > box.x + box.w - 10) { x = box.x + 12 + (name === "body" ? 28 : 0); y += box.lead; }
        out.push({text: part, x, y, line: index, start: offset, end: offset + part.length, width});
      }
      x += width;
      offset += part.length;
    }
    y += box.lead;
  });
  return out;
}
function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function drawBox(name) {
  const box = BOXES[name], placed = words(name);
  let svg = "<g id='box-" + name + "' data-box='" + name + "'>" +
    "<rect x='" + box.x + "' y='" + box.y + "' width='" + box.w + "' height='" + box.h + "' fill='transparent'" +
    (selected === name ? " stroke='#1a73e8' stroke-width='2'" : "") + "/>";
  // One text element a row, each word a text node of its own within it, as Slides draws its lines.
  const rows = [];
  for (const w of placed) {
    const line = lines(name)[w.line];
    if (line.highlight && !w.bullet) svg += "<rect x='" + w.x + "' y='" + (w.y - BOXES[name].size + 4) + "' width='" + (w.width + 6) + "' height='" + (BOXES[name].size + 6) + "' fill='" + line.highlight + "'/>";
    const row = rows[rows.length - 1];
    if (row && row.y === w.y && row.line === w.line && !w.bullet && !row.bullet) row.words.push(w);
    else rows.push({y: w.y, line: w.line, bullet: !!w.bullet, words: [w]});
  }
  for (const row of rows) {
    const line = lines(name)[row.line];
    svg += "<g><text y='" + row.y + "' font-family='Arial' font-size='" + box.size + "'" +
      (name === "title" ? " font-weight='bold'" : "") + " fill='" + line.color + "'>" +
      row.words.map(w => "<tspan x='" + w.x + "' data-line='" + w.line + "' data-end='" + (w.end || 0) + "'>" + esc(w.text) + "</tspan>").join("") +
      "</text></g>";
  }
  if (selected === name) {
    for (const [hx, hy] of [[box.x, box.y], [box.x + box.w, box.y], [box.x, box.y + box.h], [box.x + box.w, box.y + box.h]])
      svg += "<rect x='" + (hx - 4) + "' y='" + (hy - 4) + "' width='8' height='8' fill='#fff' stroke='#1a73e8'/>";
  }
  return svg + "</g>";
}
function drawSlide() {
  document.getElementById("slide").innerHTML = "<rect width='960' height='540' fill='#fff'/>" + drawBox("title") + drawBox("body");
}
function drawStrip() {
  document.getElementById("strip").innerHTML = state.slides.map((slide, i) => {
    // Thumbnails are scaled-down slides, their words in SVG as the editor draws them.
    let svg = "<svg viewBox='0 0 960 540'><rect width='960' height='540' fill='#fff'/>";
    const run = (text, x, y, size, weight, color) => {
      measure.font = weight + " " + size + "px Arial";
      const spans = [];
      for (const word of text.split(" ")) {
        spans.push("<tspan x='" + Math.round(x) + "'>" + esc(word) + "</tspan>");
        x += measure.measureText(word + " ").width;
      }
      svg += "<g><text y='" + y + "' font-size='" + size + "' font-weight='" + weight + "' fill='" + color + "'>" + spans.join("") + "</text></g>";
    };
    run(slide.title[0].text, 60, 90, 40, "bold", slide.title[0].color);
    slide.body.forEach((line, k) => run(line.text, 90, 190 + 44 * k, 26, "normal", line.color));
    return "<div class='thumb" + (i === state.current ? " current" : "") + "' data-slide='" + i + "'><span class='n'>" + (i + 1) + "</span>" + svg + "</svg></div>";
  }).join("");
}
function draw() { drawSlide(); drawStrip(); }
const editor = document.getElementById("editor");
function startEditing(name, caretAt) {
  selected = name;
  editing = true;
  editor.value = lines(name).map(l => l.text).join("\n");
  editor.focus();
  const at = caretAt === undefined ? editor.value.length : caretAt;
  editor.setSelectionRange(at, at);
  drawSlide();
}
function stopEditing() { editing = false; editor.blur(); }
editor.addEventListener("input", () => {
  const name = selected, old = lines(name);
  const texts = name === "title" ? [editor.value.replace(/\n/g, " ")] : editor.value.split("\n");
  state.slides[state.current][name] = texts.map((text, i) => ({text, color: (old[i] || old[old.length - 1]).color,
                                                             highlight: (old[i] || {}).highlight || null}));
  if (!state.edited) { state.edited = true; state.popover = "armed"; log("edit", {first: true}); }
  keep();
  log("state", {slides: state.slides});
  drawSlide();
  drawStrip();
});
function lineIndexAt(offset) { return editor.value.slice(0, offset).split("\n").length - 1; }
// The lines a style goes to: those the text selection touches while editing, or every line of a selected box.
function styledLines() {
  if (!selected) return [];
  if (!editing) return lines(selected).map((_, i) => i);
  const from = lineIndexAt(editor.selectionStart), to = lineIndexAt(Math.max(editor.selectionStart, editor.selectionEnd - 1));
  return Array.from({length: to - from + 1}, (_, k) => from + k);
}
function closePalettes() { document.querySelectorAll(".palette").forEach(p => p.remove()); }
function openPalette(kind, anchor) {
  closePalettes();
  const pal = document.createElement("div");
  pal.className = "palette";
  pal.setAttribute("role", "listbox");
  pal.setAttribute("aria-label", kind === "color" ? "Text color" : "Highlight color");
  const r = anchor.getBoundingClientRect();
  pal.style.left = r.x + "px";
  pal.style.top = (r.bottom + 4) + "px";
  let html = "<div class='head'>" + (kind === "color" ? "Text color" : "Highlight color") + "</div>";
  html += SHADES.map((n, i) => "<button type='button' aria-label='" + n + "' style='background:" + SHADE_HEX[i] + "'></button>").join("");
  html += HUES.map(([n, hex]) => "<button type='button' aria-label='" + n + "' style='background:" + hex + "'></button>").join("");
  for (const k of [1, 2, 3]) html += HUES.map(([n]) => "<button type='button' aria-label='dark " + n + " " + k + "' style='background:" + DARK[n][k - 1] + "'></button>").join("");
  pal.innerHTML = html;
  pal.addEventListener("mousedown", e => e.preventDefault());  // keeps the text selection, as Slides does
  pal.addEventListener("click", e => {
    const swatch = e.target.closest("button");
    if (!swatch) return;
    const name = swatch.getAttribute("aria-label");
    for (const i of styledLines()) lines(selected)[i][kind === "color" ? "color" : "highlight"] = COLORS[name];
    log("style", {kind, swatch: name, box: selected, lines: styledLines(), slide: state.current});
    keep();
    log("state", {slides: state.slides});
    closePalettes();
    draw();
    layout("styled");
  });
  document.body.appendChild(pal);
  layout("palette");
}
function openPopover() {
  state.popover = "open";
  keep();
  const pop = document.createElement("div");
  pop.id = "popover";
  pop.setAttribute("role", "dialog");
  pop.setAttribute("aria-label", "Try the new themes");
  pop.innerHTML = "<h2>Try the new themes</h2><p>Give your presentation a fresh look with 24 new themes made for Slides. You can switch back at any time.</p>" +
    "<button type='button' class='primary'>Try it</button><button type='button'>Not now</button>";
  pop.addEventListener("mousedown", e => e.preventDefault());
  pop.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    pop.remove();
    state.popover = "closed";
    keep();
    log("popover", {phase: "closed", via: b.textContent});
    if (b.textContent === "Try it") {
      const panel = document.createElement("div");
      panel.id = "panel";
      panel.innerHTML = "<h3>Themes</h3><p>In this presentation: Simple Light</p><button type='button'>Close</button>";
      panel.querySelector("button").addEventListener("click", () => panel.remove());
      document.body.appendChild(panel);
    }
    layout("popover closed");
  });
  document.body.appendChild(pop);
  log("popover", {phase: "open"});
  layout("popover");
}
document.getElementById("menus").innerHTML = MENUS.map(m => "<button type='button' role='menuitem'>" + m + "</button>").join("");
document.getElementById("toolbar").innerHTML = TOOLS.map(t => t ? "<button type='button' aria-label='" + t[0] + "' title='" + t[0] + "'>" + t[1] + "</button>" : "<span class='sep'></span>").join("");
document.getElementById("toolbar").addEventListener("mousedown", e => e.preventDefault());  // keeps the text selection
document.getElementById("toolbar").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const name = b.getAttribute("aria-label");
  log("tool", {name});
  if (name === "Text color") openPalette("color", b);
  else if (name === "Highlight color") openPalette("highlight", b);
  else closePalettes();
});
document.getElementById("strip").addEventListener("mousedown", e => {
  const thumb = e.target.closest(".thumb");
  if (!thumb) return;
  stopEditing();
  selected = null;
  state.current = Number(thumb.dataset.slide);
  keep();
  log("slide", {current: state.current});
  closePalettes();
  draw();
  layout("slide");
});
document.getElementById("slide").addEventListener("mousedown", e => {
  closePalettes();
  const boxEl = e.target.closest("[data-box]");
  if (!boxEl) { stopEditing(); selected = null; drawSlide(); layout("deselect"); return; }
  const name = boxEl.dataset.box;
  const word = e.target.closest("tspan");
  if (editing && selected === name) {
    // In the text: one click puts the caret after the word, two select the word, three its line.
    e.preventDefault();
    if (!word || word.dataset.line === undefined) return;
    const line = Number(word.dataset.line);
    const lineStart = editor.value.split("\n").slice(0, line).reduce((n, l) => n + l.length + 1, 0);
    const end = lineStart + Number(word.dataset.end);
    if (e.detail >= 3) editor.setSelectionRange(lineStart, lineStart + editor.value.split("\n")[line].length);
    else if (e.detail === 2) editor.setSelectionRange(end - word.textContent.length, end);
    else editor.setSelectionRange(end, end);
    editor.focus();
    return;
  }
  if (selected === name || e.detail >= 2) { e.preventDefault(); startEditing(name); layout("editing"); return; }
  stopEditing();
  selected = name;
  drawSlide();
  layout("selected");
});
editor.addEventListener("keydown", e => {
  if (e.key === "Escape") { stopEditing(); drawSlide(); layout("escape"); }
});
for (const kind of ["keydown", "mousedown", "mouseup", "input"]) document.addEventListener(kind, () => { lastInput = Date.now(); }, true);
document.addEventListener("mousemove", () => {
  // The nudge Slides shows once you have worked a while: at the start of the agent's next queue after its first edit.
  if (state.popover === "armed" && Date.now() - lastInput >= IDLE_MS) openPopover();
}, true);
draw();
if (state.popover === "open") openPopover();
if (fresh) { keep(); log("load", {}); log("state", {slides: state.slides}); }
layout("load");
</script>
</body>
</html>
