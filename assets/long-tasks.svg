<text class="head" x="420" y="35" text-anchor="middle">Claude</text>
<text class="head" x="420" y="58" text-anchor="middle">in Chrome</text>
<rect class="ours" x="0" y="108" width="120" height="40"/>
<line class="rule" x1="0" x2="480" y1="76.5" y2="76.5"/>
<text class="label" x="16" y="101">Runs passed out of 9</text>
<text x="60" y="135" text-anchor="middle">8</text>
<text x="180" y="135" text-anchor="middle">7</text>
<text class="best" x="300" y="135" text-anchor="middle">9</text>
<text x="420" y="135" text-anchor="middle">8</text>
<rect class="gap" x="0" y="148" width="480" height="16"/>
<rect class="ours" x="0" y="196" width="120" height="40"/>
<line class="rule" x1="0" x2="480" y1="164.5" y2="164.5"/>
<text class="label" x="16" y="189">Total time</text>
<text class="best" x="60" y="223" text-anchor="middle">193 min</text>
<text x="180" y="223" text-anchor="middle">315 min</text>
<text x="300" y="223" text-anchor="middle">285 min</text>
<text x="420" y="223" text-anchor="middle">278 min</text>
<rect class="ours" x="0" y="268" width="120" height="40"/>
<line class="rule" x1="0" x2="480" y1="236.5" y2="236.5"/>
<text class="label" x="16" y="261">Total cost</text>
<text class="best" x="60" y="295" text-anchor="middle">$43.81</text>
<text x="180" y="295" text-anchor="middle">$66.03</text>
<text x="300" y="295" text-anchor="middle">$138.48</text>
<text x="420" y="295" text-anchor="middle">$76.09</text>
