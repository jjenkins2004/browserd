<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="520">
<style>
  :root { --bg: #0A0F1A; --panel: #10172A; --line: #253050; --text: #DCE3F0; --muted: #7D89A6; --accent: #46C8E8; --hover: rgba(70, 200, 232, .10); --good: #5BDC8F; }
  text { font: 21px -apple-system, system-ui, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; fill: var(--text); }
  .card { fill: var(--panel); stroke: var(--line); }
  .ours { fill: var(--hover); }
  .bar { fill: var(--accent); }
  .gap { fill: var(--bg); }
  .rule { stroke: var(--line); }
  .head { fill: var(--muted); font-size: 16px; font-weight: 600; }
  .name { fill: var(--accent); font-size: 21px; font-weight: 700; }
  .label { fill: var(--muted); font-size: 17px; }
  .best { fill: var(--good); font-weight: 700; }
</style>
<clipPath id="c"><rect x="0.5" y="0.5" width="479" height="379" rx="12"/></clipPath>
<rect class="card" x="0.5" y="0.5" width="479" height="379" rx="12"/>
<g clip-path="url(#c)">
<rect class="ours" x="0" y="0" width="120" height="76"/>
<rect class="bar" x="0" y="0" width="120" height="3"/>
<text class="name" x="60" y="46" text-anchor="middle">browserd</text>
